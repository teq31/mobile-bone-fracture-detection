# Flutter app: analyze + test on every PR that touches mobile/, and an APK you can download.
# Pushing a tag like v0.2.0 also attaches the APK to a GitHub Release.
name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # infos (e.g. deprecations) are shown but don't fail the build
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  apk:
    name: build APK
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # backend address from the repo variable API_BASE_URL (Settings > Variables), emulator address otherwise
      - name: flutter build apk
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bone-fracture-app-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
