spring.application.name=mobile-bone-fracture-detection

# Database. Default: H2 in memory (local work, tests).
# For PostgreSQL (docker-compose) set the environment variables
# SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/<name>, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD;
# Spring Boot uses them instead of the values below.
spring.datasource.url=jdbc:h2:mem:bonefracture
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT login tokens. Set JWT_SECRET (at least 32 characters) outside local development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-0123456789}
app.jwt.expiration-hours=24

# First administrator account, created at startup (administrators cannot register through the API).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# YOLOv8 fracture model, created by ml/export_onnx.py. Without the file the placeholder model is used.
app.analysis.yolo-weights=${YOLO_MODEL:models/yolov8-fracture.onnx}
# Contrast stretching (ImagePreprocessor.normalize) before the model. Off: on the 4,094 validation X-rays
# mAP50 is 0.634 without it and 0.623 with it (docs/detection-model/README.md).
app.analysis.contrast-stretching=false

# Where uploaded X-ray images are stored on disk.
app.analysis.upload-dir=${ANALYSIS_UPLOAD_DIR:uploads}

# Allow larger X-ray uploads.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
