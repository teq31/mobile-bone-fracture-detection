spring.application.name=mobile-bone-fracture-detection

# Database. Default: H2 in memory (local work, tests).
# For PostgreSQL (docker-compose) set the environment variables
# SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/<name>, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD;
# Spring Boot uses them instead of the values below.
spring.datasource.url=jdbc:h2:mem:bonefracture
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT login tokens. Set JWT_SECRET (at least 32 characters) outside local development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-0123456789}
app.jwt.expiration-hours=24
